name: AIUsageMenu
options:
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.7.0
targets:
  AIUsageMenu:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        LSUIElement: true
        SUFeedURL: https://aiusagemenu.com/appcast.xml
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: true
        SUScheduledCheckInterval: 86400
        SUPublicEDKey: XJgsOnPjfs4jvp9Gb5EVoYOXvuxTz3uezVuzwqFNzZY=
        SUSendProfileInfo: false
        NSHumanReadableCopyright: "© 2026 BaseThread LLC. MIT License."
    sources:
      - Sources
      - Assets.xcassets
      - Resources
      - ../brand/08-design-tokens/BrandColors.swift
    settings:
      base:
        PRODUCT_NAME: AI Usage Menu
        PRODUCT_BUNDLE_IDENTIFIER: ai.aiusagemenu.app
        MARKETING_VERSION: 1.0.2
        CURRENT_PROJECT_VERSION: 4
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_APP_SANDBOX: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all
  ScaffoldTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: AIUsageMenu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.aiusagemenu.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AI Usage Menu.app/Contents/MacOS/AI Usage Menu"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  AIUsageMenu:
    build:
      targets:
        AIUsageMenu: all
    test:
      targets: [ScaffoldTests]
