name: Bug report
description: Something in the app doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    attributes: { label: What happened, description: What you saw and what you expected instead. }
    validations: { required: true }
  - type: input
    id: versions
    attributes: { label: App and macOS versions, placeholder: "AI Usage Menu 1.0.0, macOS 15.2" }
    validations: { required: true }
  - type: textarea
    attributes: { label: Steps to reproduce }
